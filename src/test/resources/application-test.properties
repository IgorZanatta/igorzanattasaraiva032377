# Test Configuration
spring.config.activate.on-profile=test

# H2 Database for Tests (In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (H2 doesn't support PostgreSQL extensions like pgcrypto)
spring.flyway.enabled=false

# JWT Configuration for Tests
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tdGVzdGluZy1wdXJwb3Nlcy1vbmx5LTEyMzQ1Njc4OTA=
jwt.expiration-ms=300000
jwt.refresh-expiration-ms=3600000

# MinIO Configuration for Tests (mocked in unit tests)
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=test-bucket
minio.public-url=

# Argus Client Configuration for Tests (mocked in unit tests)
argus.regional.url=http://localhost:8081/api/regionais

# Logging
logging.level.root=WARN
logging.level.br.gov.mt.seplag.igorzannattasaraiva032377=INFO
